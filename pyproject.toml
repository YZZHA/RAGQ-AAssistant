[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/"]

[project]
name = "rag-qa-assistant"
version = "0.1.0"
description = "FDI 部门智能 RAG 问答助手 — 垂直领域智能问答 Agent"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "FDI Team" }]

dependencies = [
    # --- AI 框架 ---
    "langchain>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-openai>=0.2.0",
    "langgraph>=0.2.0",

    # --- 向量数据库 ---
    "pymilvus>=2.4.0",

    # --- 全文检索（备选） ---
    "elasticsearch[async]>=8.15.0",

    # --- 缓存与内存 ---
    "redis[hiredis]>=5.0.0",

    # --- Web 框架 ---
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",

    # --- 数据模型 ---
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",

    # --- 嵌入模型 ---
    "sentence-transformers>=3.1.0",

    # --- LLM 客户端 ---
    "openai>=1.50.0",

    # --- 精排 ---
    "FlagEmbedding>=1.3.0",

    # --- 文档解析 ---
    "python-docx>=1.1.0",
    "pypdf>=5.0.0",
    "markdown>=3.7",
    "beautifulsoup4>=4.12",

    # --- 分词 ---
    "jieba>=0.42.1",

    # --- 可观测性 ---
    "langfuse>=2.50.0",

    # --- 序列化 ---
    "protobuf>=5.28.0",

    # --- 工具 ---
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.2",
    "httpx>=0.27.0",
    "tenacity>=9.0.0",
    "tiktoken>=0.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "types-pyyaml>=6.0.0",
    "types-redis>=4.6.0",
    "types-requests>=2.32.0",
]

[project.scripts]
rag-init-milvus = "scripts.init_milvus:main"
rag-batch-ingest = "scripts.batch_ingest:main"
rag-run-eval = "scripts.run_eval:main"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "W",   # pycodestyle warnings
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]
ignore = ["E501"]  # line too long handled by formatter

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
warn_return_any = false
warn_unused_ignores = true

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "scripts/*"]

[tool.coverage.report]
exclude_also = [
    'if TYPE_CHECKING:',
    'raise NotImplementedError',
    '\.\.\.',
]
