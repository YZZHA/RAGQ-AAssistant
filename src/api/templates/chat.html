<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FDI RAG 问答助手</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
  body { background: #f5f7fa; height: 100vh; }
  .chat-container { max-width: 800px; margin: 0 auto; height: 100vh; display: flex; flex-direction: column; }
  .header { background: #0d6efd; color: white; padding: 16px 24px; border-radius: 0 0 12px 12px; }
  .header h1 { font-size: 20px; margin: 0; }
  .header small { opacity: 0.8; }
  .messages { flex: 1; overflow-y: auto; padding: 20px 16px; }
  .message { margin-bottom: 16px; display: flex; }
  .message.user { justify-content: flex-end; }
  .message .bubble { max-width: 75%; padding: 12px 16px; border-radius: 16px; line-height: 1.6; font-size: 14px; white-space: pre-wrap; }
  .message.user .bubble { background: #0d6efd; color: white; border-radius: 16px 16px 4px 16px; }
  .message.assistant .bubble { background: white; border: 1px solid #e0e0e0; border-radius: 16px 16px 16px 4px; }
  .message.assistant .sources { font-size: 12px; color: #888; margin-top: 8px; }
  .feedback-btn { font-size: 12px; padding: 2px 10px; border-radius: 12px; margin-top: 6px; cursor: pointer; }
  .thinking { color: #888; font-style: italic; padding: 12px 16px; display: none; }
  .input-area { padding: 12px 16px 20px; background: white; border-top: 1px solid #e0e0e0; border-radius: 12px 12px 0 0; }
  .input-area input { flex: 1; border-radius: 24px; border: 1px solid #ddd; padding: 10px 16px; font-size: 14px; }
  .input-area input:focus { outline: none; border-color: #0d6efd; box-shadow: 0 0 0 2px rgba(13,110,253,0.15); }
  .input-area button { border-radius: 24px; padding: 10px 24px; white-space: nowrap; }
</style>
</head>
<body>
<div class="chat-container">
    <div class="header d-flex justify-content-between align-items-center">
    <div>
      <h1 class="fs-5 mb-0">FDI 问答助手</h1>
      <small>外商投资领域智能知识库</small>
    </div>
    <a href="/gaps" class="btn btn-outline-light btn-sm" title="知识缺口管理">📋</a>
  </div>

  <div class="messages" id="messageList">
    <div class="message assistant">
      <div class="bubble">您好！我是 FDI 业务助手，可以回答外商投资登记、负面清单、优惠政策等相关问题。</div>
    </div>
  </div>

  <div class="thinking" id="thinking">正在思考...</div>

  <div class="input-area">
    <form id="chatForm" class="d-flex gap-2">
      <input type="text" id="questionInput" class="form-control" placeholder="输入问题..." autofocus>
      <button type="submit" class="btn btn-primary">发送</button>
      <button type="button" id="newSessionBtn" class="btn btn-outline-secondary">新建</button>
    </form>
  </div>
</div>

<script>
const messageList = document.getElementById('messageList');
const chatForm = document.getElementById('chatForm');
const questionInput = document.getElementById('questionInput');
const thinking = document.getElementById('thinking');
let sessionId = localStorage.getItem('rag_session_id') || 'sess_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
if (!localStorage.getItem('rag_session_id')) {
  localStorage.setItem('rag_session_id', sessionId);
}

let lastQuestion = '';

function addMessage(role, content, sources, hasGap) {
  const div = document.createElement('div');
  div.className = 'message ' + role;
  let html = '<div class="bubble">' + content;
  if (sources && sources.length > 0) {
    html += '\n\n来源: ' + sources.map(s => s.title || s.doc_id).join(', ');
  }
  html += '</div>';
  if (role === 'assistant') {
    html += '<div class="d-flex gap-2">';
    if (hasGap) {
      html += '<button class="btn btn-outline-warning btn-sm feedback-btn" onclick="reportUnsolved()">📝 未解决</button>';
    }
    html += '</div>';
  }
  div.innerHTML = html;
  messageList.appendChild(div);
  messageList.scrollTop = messageList.scrollHeight;
}

function updateStreaming(text) {
  let el = document.getElementById('streamingBubble');
  if (!el) {
    const msgDiv = document.createElement('div');
    msgDiv.className = 'message assistant';
    msgDiv.id = 'streamingMsg';
    msgDiv.innerHTML = '<div class="bubble" id="streamingBubble"></div>';
    messageList.appendChild(msgDiv);
    el = document.getElementById('streamingBubble');
  }
  el.textContent = text;
  messageList.scrollTop = messageList.scrollHeight;
}

function finalizeStreaming(sources, hasGap) {
  const el = document.getElementById('streamingMsg');
  if (el) {
    const bubble = el.querySelector('.bubble');
    if (sources && sources.length > 0) {
      bubble.textContent += '\n\n来源: ' + sources.map(s => s.title || s.doc_id).join(', ');
    }
    const div = document.createElement('div');
    div.className = 'd-flex gap-2';
    if (hasGap) {
      div.innerHTML = '<button class="btn btn-outline-warning btn-sm feedback-btn" onclick="reportUnsolved()">📝 未解决</button>';
    }
    el.appendChild(div);
    el.removeAttribute('id');
  }
}

async function reportUnsolved() {
  try {
    await fetch('/api/feedback', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ session_id: sessionId, question: lastQuestion }),
    });
    alert('已记录反馈，感谢您的帮助！');
  } catch (e) {
    alert('提交失败，请重试。');
  }
}

chatForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  const question = questionInput.value.trim();
  if (!question) return;

  lastQuestion = question;
  addMessage('user', question);
  questionInput.value = '';
  thinking.style.display = 'block';

  try {
    const resp = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question, session_id: sessionId }),
    });

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    let fullText = '';
    let sources = [];
    let hasGap = false;
    let eventType = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;

      buffer += decoder.decode(value, { stream: true });
      const parts = buffer.split('\n');
      buffer = parts.pop() || '';

      for (const line of parts) {
        if (line.startsWith('event: ')) {
          eventType = line.slice(7).trim();
        } else if (line.startsWith('data: ')) {
          try {
            const data = JSON.parse(line.slice(6));
            if (eventType === 'done') {
              sources = data.sources || [];
              hasGap = data.has_gap || false;
            } else if (eventType === 'error') {
              fullText = data.message;
              updateStreaming(fullText);
            } else {
              if (data.token) {
                fullText += data.token;
                updateStreaming(fullText);
              }
            }
          } catch (e) {}
        }
      }
    }

    finalizeStreaming(sources, hasGap);
  } catch (e) {
    addMessage('assistant', '网络错误，请检查连接后重试。');
  }

  thinking.style.display = 'none';
});

document.getElementById('newSessionBtn').addEventListener('click', () => {
  sessionId = 'sess_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  localStorage.setItem('rag_session_id', sessionId);
  messageList.innerHTML = '<div class="message assistant"><div class="bubble">会话已重置。</div></div>';
  questionInput.focus();
});
</script>
</body>
</html>
